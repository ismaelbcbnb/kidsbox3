                    <div class="transcript hidden  " id="transcript_523902dcea81455b67db3e1a48873ef8">

        
    	 <p>GIRL: This is a nice picture. The two men are fishing in the river.</p> <p>MAN: That's right. Colour the fish. Make it grey.</p> <p>GIRL: The fish? OK. I'm doing that now. Do you go fishing?</p> <p>MAN: I do sometimes.</p> <p> </p> <p>Can you see the grey fish? This is an example. Now you listen and colour and draw.</p> <p> </p> <ol><li>GIRL: There are two cows in the farmer's field. Can I colour the small one?<br> MAN: The small fat one? Yes, that's a good idea. Colour it with your yellow pencil.<br> GIRL: That's a funny colour for a cow … but all right!<br> MAN: Thank you.<br>  </li> <li>MAN: Shall we colour the girl's jacket now?<br> GIRL: The girl's jacket?<br> MAN: Yes. Make it red.<br> GIRL: OK. I can do that. I think she's got a headache … look!<br> MAN: I think you're right!<br>  </li> <li>MAN: Can you draw a leaf next to the tree?<br> GIRL: A leaf? Next to the ball?<br> MAN: Yes, that's right.<br> GIRL: I'm doing that now.<br> MAN: Great!<br>  </li> <li>MAN: Can you colour the duck now?<br> GIRL: The duck in the river?<br> MAN: No. Colour the duck next to the plant.<br> GIRL: OK. Well, I've got a purple pencil. Can I colour it purple?<br> MAN: Yes, you can.<br> GIRL: Thanks!<br>  </li> <li>GIRL: Can you see the thirsty woman?<br> MAN: The thirsty woman? No, I can't.<br> GIRL: She's next to the picnic.<br> MAN: Oh yes!<br> GIRL: Shall I colour the woman's hat blue?<br> MAN: Good idea.</li> </ol></div>
